[package]
name = "adg-powerd"
description = "ADG Power OS unprivileged telemetry and control daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "adg_power"
path = "src/lib.rs"

[[bin]]
name = "adg-powerd"
path = "src/main.rs"

[[bin]]
name = "adg-power-helper"
path = "src/bin/adg-power-helper.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[dev-dependencies]
tempfile = "3"
