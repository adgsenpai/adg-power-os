[package]
name = "adg-power-dashboard"
description = "ADG Power OS dashboard (Tauri shell)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "adg-power-dashboard"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
adg-powerd = { path = "../../crates/adg-powerd", default-features = false }
